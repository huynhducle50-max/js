<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Interactive Photo Gallery</h1>
        <p>Hover over an image to explore the gallery!</p>
    </header>

    <main>
        <div id="image">
            Hover over an image below to display here.
        </div>

        <div class="gallery">
            <img
                src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
                alt="Beautiful mountain and lake"
                onmouseover="upDate(this)"
                onmouseleave="undo()">

            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                alt="Peaceful lake surrounded by mountains"
                onmouseover="upDate(this)"
                onmouseleave="undo()">

            <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                alt="Sunlight shining through a green forest"
                onmouseover="upDate(this)"
                onmouseleave="undo()">

            <img
                src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
                alt="Golden sunrise over a beautiful landscape"
                onmouseover="upDate(this)"
                onmouseleave="undo()">

            <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                alt="Amazing nature scenery"
                onmouseover="upDate(this)"
                onmouseleave="undo()">

            <img
                src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
                alt="Majestic snow-covered mountains"
                onmouseover="upDate(this)"
                onmouseleave="undo()">
        </div>
    </main>

    <footer>
        <p>Interactive Photo Gallery | HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
